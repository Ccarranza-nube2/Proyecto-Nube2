# docker-compose.yml
version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_USER: flaskuser
      POSTGRES_PASSWORD: flaskpass
      POSTGRES_DB: flaskdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  flask-app:
    image: dannicc/proyecto_nube:latest
    container_name: proyecto-flask
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "postgresql://flaskuser:flaskpass@postgres:5432/flaskdb"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data: