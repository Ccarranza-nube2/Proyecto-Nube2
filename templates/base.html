<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Inventario Abarrotes{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Paleta de colores mejorada y diseño más moderno para tienda de abarrotes */
        :root {
            --primary-color: #2d6a4f;
            --primary-dark: #1b4332;
            --accent-color: #f77f00;
            --accent-light: #fcbf49;
            --background: #f8f9fa;
            --card-shadow: 0 4px 20px rgba(0,0,0,0.08);
            --card-hover: 0 8px 30px rgba(0,0,0,0.12);
        }
        
        body {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        /* Navbar mejorado */
        .navbar {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%) !important;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border-bottom: 3px solid var(--accent-color);
        }
        
        .navbar-brand .navbar-item {
            color: white !important;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            transition: transform 0.3s ease;
        }
        
        .navbar-brand .navbar-item:hover {
            transform: scale(1.05);
            background-color: rgba(255,255,255,0.1) !important;
        }
        
        .navbar-item .store-icon {
            color: var(--accent-light);
            font-size: 1.8rem;
            margin-right: 12px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }
        
        /* Cards mejoradas */
        .card {
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            margin-bottom: 30px;
            border: none;
            transition: all 0.3s ease;
            overflow: hidden;
            background: white;
        }
        
        .card:hover {
            box-shadow: var(--card-hover);
            transform: translateY(-4px);
        }
        
        .card-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
            border-radius: 16px 16px 0 0;
            padding: 20px 25px;
            border-bottom: 3px solid var(--accent-color);
        }
        
        .card-header-title {
            color: white !important;
            font-size: 1.3rem;
            font-weight: 700;
            display: flex;
            align-items: center;
        }
        
        .card-header-title i {
            color: var(--accent-light);
            margin-right: 12px;
            font-size: 1.4rem;
        }
        
        .card-content {
            padding: 30px;
        }
        
        /* Tabla mejorada */
        .table-container {
            border-radius: 12px;
            overflow: hidden;
        }
        
        .table {
            background: white;
            border-radius: 12px;
        }
        
        .table thead {
            background: linear-gradient(135deg, #e9ecef 0%, #dee2e6 100%);
        }
        
        .table thead th {
            color: var(--primary-dark);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            border: none;
            padding: 18px 12px;
        }
        
        .table tbody tr {
            transition: all 0.2s ease;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .table tbody tr:hover {
            background-color: #f8f9fa;
            transform: scale(1.01);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .table td {
            vertical-align: middle;
            padding: 15px 12px;
        }
        
        /* Tags mejorados */
        .tag {
            border-radius: 8px;
            font-weight: 600;
            padding: 8px 14px;
            font-size: 0.85rem;
            letter-spacing: 0.3px;
        }
        
        .tag.is-info {
            background: linear-gradient(135deg, #0dcaf0 0%, #0aa2c0 100%);
            color: white;
        }
        
        .tag.is-dark {
            background: linear-gradient(135deg, #495057 0%, #343a40 100%);
            color: white;
        }
        
        .tag.is-success {
            background: linear-gradient(135deg, #52b788 0%, #2d6a4f 100%);
            color: white;
            font-weight: 700;
        }
        
        .tag.is-danger {
            background: linear-gradient(135deg, #e63946 0%, #d62828 100%);
            color: white;
        }
        
        .tag.is-warning {
            background: linear-gradient(135deg, #ffc107 0%, #ffb000 100%);
            color: #333;
        }
        
        /* Botones mejorados */
        .button {
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .button.is-success {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
        }
        
        .button.is-success:hover {
            background: linear-gradient(135deg, var(--primary-dark) 0%, #0f2419 100%);
        }
        
        .button.is-warning {
            background: linear-gradient(135deg, var(--accent-light) 0%, var(--accent-color) 100%);
            color: white;
        }
        
        .button.is-danger {
            background: linear-gradient(135deg, #e63946 0%, #d62828 100%);
            color: white;
        }
        
        .button.is-info {
            background: linear-gradient(135deg, #0dcaf0 0%, #0aa2c0 100%);
            color: white;
        }
        
        /* Formularios mejorados */
        .field .label {
            color: var(--primary-dark);
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }
        
        .input, .textarea, .select select {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
            padding: 12px 16px;
        }
        
        .input:focus, .textarea:focus, .select select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.1);
        }
        
        /* Empty state mejorado */
        .empty-state {
            background: white;
            border-radius: 16px;
            padding: 60px 40px;
            text-align: center;
            box-shadow: var(--card-shadow);
        }
        
        .empty-state i {
            color: var(--accent-color);
            margin-bottom: 20px;
        }
        
        /* Footer mejorado */
        .footer {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 30px 20px;
            margin-top: 60px;
            border-top: 3px solid var(--accent-color);
        }
        
        .footer p {
            color: rgba(255,255,255,0.9);
            font-weight: 500;
        }
        
        /* Animaciones sutiles */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .card {
            animation: fadeIn 0.5s ease;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .card-content {
                padding: 20px;
            }
            
            .navbar-brand .navbar-item {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar" role="navigation" aria-label="main navigation">
        <div class="container">
            <div class="navbar-brand">
                <a class="navbar-item" href="/">
                    <i class="fas fa-store-alt store-icon"></i>
                    <span>
                        Inventario Abarrotes "El ProfeTec"
                    </span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <section class="section">
        <div class="container">
            {% block content %}
            <!-- Aquí va el contenido específico de cada página -->
            {% endblock %}
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="content has-text-centered">
            <p>
                <i class="fas fa-shopping-basket"></i>&nbsp;
                © 2025 Sistema de Inventario de Abarrotes "El CHINO"
                &nbsp;<i class="fas fa-heart" style="color: var(--accent-light);"></i>
            </p>
        </div>
    </footer>
</body>
</html>
