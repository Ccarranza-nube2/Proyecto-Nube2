{% extends 'base.html' %}
{% block title%} Editar Producto - Inventario Abarrotes{% endblock %}
{% block content%}
<div class="columns">
    <div class="column is-offset-2 is-8">
        <div class="card">
            <div class="card-header">
                <p class="card-header-title has-text-white">
                    <i class="fas fa-edit"></i>&nbsp; Editar Producto
                </p>
            </div>
            <div class="card-content">
                <div class="content">
                    <form action="{{ url_for('editar_producto', id=producto.id) }}" method="post">
                        
                        <!-- Nombre del Producto -->
                        <div class="field">
                            <label class="label">Nombre del Producto:</label>
                            <div class="control">
                                <input class="input" type="text" name="nombre" value="{{ producto.nombre }}" required placeholder="Ej: Arroz, Leche, Jabón">
                            </div>
                        </div>

                        <!-- Descripción -->
                        <div class="field">
                            <label class="label">Descripción (opcional):</label>
                            <div class="control">
                                <textarea class="textarea" name="descripcion" placeholder="Descripción del producto" rows="2">{{ producto.descripcion or '' }}</textarea>
                            </div>
                        </div>

                        <div class="columns">
                            <!-- Tipo de Producto -->
                            <div class="column">
                                <div class="field">
                                    <label class="label">Tipo de Producto:</label>
                                    <div class="control">
                                        <div class="select is-fullwidth">
                                            <select name="tipo" required>
                                                <option value="Alimentos" {% if producto.tipo == 'Alimentos' %}selected{% endif %}>Alimentos</option>
                                                <option value="Bebidas" {% if producto.tipo == 'Bebidas' %}selected{% endif %}>Bebidas</option>
                                                <option value="Limpieza" {% if producto.tipo == 'Limpieza' %}selected{% endif %}>Limpieza</option>
                                                <option value="Cuidado Personal" {% if producto.tipo == 'Cuidado Personal' %}selected{% endif %}>Cuidado Personal</option>
                                                <option value="Otros" {% if producto.tipo == 'Otros' %}selected{% endif %}>Otros</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Cantidad -->
                            <div class="column">
                                <div class="field">
                                    <label class="label">Cantidad:</label>
                                    <div class="control">
                                        <input class="input" type="number" name="cantidad" value="{{ producto.cantidad }}" min="0" required>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Precio -->
                        <div class="field">
                            <label class="label">Precio:</label>
                            <div class="control">
                                <input class="input" type="number" step="0.01" name="precio" value="{{ "%.2f"|format(producto.precio) }}" min="0" required>
                            </div>
                        </div>

                        <!-- Botones -->
                        <div class="field is-grouped">
                            <div class="control">
                                <button class="button is-success" type="submit">
                                    <i class="fas fa-save"></i>&nbsp; Guardar Cambios
                                </button>
                            </div>
                            <div class="control">
                                <a class="button is-danger" href="{{ url_for('index') }}">
                                    <i class="fas fa-times"></i>&nbsp; Cancelar
                                </a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock%}
