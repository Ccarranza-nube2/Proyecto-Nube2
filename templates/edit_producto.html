{% extends 'base.html' %}
{% block title%} Editar Producto - Inventario Abarrotes{% endblock %}
{% block content%}
<div class="columns">
    <div class="column is-offset-2 is-8">
        <!-- Header con diseño mejorado -->
        <div class="mb-4">
            <a href="{{ url_for('index') }}" class="button is-light">
                <span class="icon">
                    <i class="fas fa-arrow-left"></i>
                </span>
                <span>Volver al inventario</span>
            </a>
        </div>
        
        <div class="card">
            <div class="card-header">
                <p class="card-header-title">
                    <i class="fas fa-edit"></i> Editar Producto: {{ producto.nombre }}
                </p>
            </div>
            <div class="card-content">
                <div class="content">
                    <form action="{{ url_for('editar_producto', id=producto.id) }}" method="post">
                        
                        <!-- Nombre del Producto -->
                        <div class="field">
                            <label class="label">
                                <i class="fas fa-tag" style="color: var(--accent-color);"></i>
                                Nombre del Producto
                            </label>
                            <div class="control has-icons-left">
                                <input class="input" type="text" name="nombre" value="{{ producto.nombre }}" required placeholder="Ej: Arroz 1kg, Leche Lala, Jabón Zote">
                                <span class="icon is-small is-left">
                                    <i class="fas fa-shopping-basket"></i>
                                </span>
                            </div>
                        </div>

                        <!-- Descripción -->
                        <div class="field">
                            <label class="label">
                                <i class="fas fa-align-left" style="color: var(--accent-color);"></i>
                                Descripción
                                <span class="tag is-light is-small ml-2">Opcional</span>
                            </label>
                            <div class="control">
                                <textarea class="textarea" name="descripcion" placeholder="Descripción detallada del producto..." rows="3">{{ producto.descripcion or '' }}</textarea>
                            </div>
                        </div>

                        <div class="columns">
                            <!-- Tipo de Producto -->
                            <div class="column">
                                <div class="field">
                                    <label class="label">
                                        <i class="fas fa-layer-group" style="color: var(--accent-color);"></i>
                                        Categoría
                                    </label>
                                    <div class="control has-icons-left">
                                        <div class="select is-fullwidth">
                                            <select name="tipo" required>
                                                <option value="Alimentos" {% if producto.tipo == 'Alimentos' %}selected{% endif %}>🍞 Alimentos</option>
                                                <option value="Bebidas" {% if producto.tipo == 'Bebidas' %}selected{% endif %}>🥤 Bebidas</option>
                                                <option value="Limpieza" {% if producto.tipo == 'Limpieza' %}selected{% endif %}>🧹 Limpieza</option>
                                                <option value="Cuidado Personal" {% if producto.tipo == 'Cuidado Personal' %}selected{% endif %}>🧴 Cuidado Personal</option>
                                                <option value="Otros" {% if producto.tipo == 'Otros' %}selected{% endif %}>📦 Otros</option>
                                            </select>
                                        </div>
                                        <span class="icon is-small is-left">
                                            <i class="fas fa-list"></i>
                                        </span>
                                    </div>
                                </div>
                            </div>

                            <!-- Cantidad -->
                            <div class="column">
                                <div class="field">
                                    <label class="label">
                                        <i class="fas fa-cubes" style="color: var(--accent-color);"></i>
                                        Cantidad en Stock
                                    </label>
                                    <div class="control has-icons-left">
                                        <input class="input" type="number" name="cantidad" value="{{ producto.cantidad }}" min="0" required>
                                        <span class="icon is-small is-left">
                                            <i class="fas fa-box"></i>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Precio -->
                        <div class="field">
                            <label class="label">
                                <i class="fas fa-dollar-sign" style="color: var(--accent-color);"></i>
                                Precio Unitario
                            </label>
                            <div class="control has-icons-left">
                                <input class="input" type="number" step="0.01" name="precio" value="{{ "%.2f"|format(producto.precio) }}" min="0" required>
                                <span class="icon is-small is-left">
                                    <i class="fas fa-money-bill-wave"></i>
                                </span>
                            </div>
                            <p class="help">Ingresa el precio en pesos mexicanos</p>
                        </div>

                        <hr>

                        <!-- Botones -->
                        <div class="field is-grouped is-grouped-right">
                            <div class="control">
                                <a class="button is-light is-medium" href="{{ url_for('index') }}">
                                    <span class="icon">
                                        <i class="fas fa-times"></i>
                                    </span>
                                    <span>Cancelar</span>
                                </a>
                            </div>
                            <div class="control">
                                <button class="button is-success is-medium" type="submit">
                                    <span class="icon">
                                        <i class="fas fa-check-circle"></i>
                                    </span>
                                    <span>Guardar Cambios</span>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock%}
